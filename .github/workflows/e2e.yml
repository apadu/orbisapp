# Runs the end-to-end smoke tests (tests/e2e) on every push and pull request.
# No secrets needed: the tests answer every Supabase call themselves.
name: Smoke tests

on:
  push:
  pull_request:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      # a placeholder backend so the account features are switched on; the tests fake every call
      VITE_SUPABASE_URL: https://e2e-test.supabase.co
      VITE_SUPABASE_ANON_KEY: e2e-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Keep the report when something fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
